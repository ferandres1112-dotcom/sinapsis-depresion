<script>
const DATA={"slides":[{"id":"sinapsis","tag":"01 / FISIOLOGÍA Y DIANAS","title":"Entra a la sinapsis","subtitle":"Toca los fármacos y los blancos moleculares. Después explica qué consecuencia clínica esperarías.","minutes":"3 min","max":15,"theme":"mint","glyph":"◎","refs":[["Goodman & Gilman, 14.ª ed., caps. 15 y 18; figuras 15-4 y 18-1",""],["Katzung, Farmacología básica y clínica, 15.ª ed., cap. 30, mecanismo de acción (PDF, pp. 9–18)",""],["OpenEvidence, Neurotransmisión serotoninérgica, PDF adjunto, pp. 1–4, 7–9 (síntesis de estudios)",""]],"qs":[{"id":"S1","pts":5,"type":"choice","prompt":"Una paciente lleva cuatro días tomando fluoxetina. Presenta náuseas, pero todavía no percibe mejoría del ánimo. ¿Qué explica esta diferencia en el momento de aparición de los efectos?","opts":["Las náuseas aparecen desde el inicio, mientras que el efecto antidepresivo depende principalmente de alcanzar concentraciones plasmáticas estables.","La inhibición de SERT comienza pronto, pero la mejoría clínica requiere adaptaciones progresivas de los circuitos neuronales.","La activación de los autorreceptores 5-HT₁A retrasa la respuesta, porque impide que fluoxetina inhiba SERT durante los primeros días."],"ans":1,"why":"La inhibición de SERT ocurre desde las primeras dosis y puede producir efectos serotoninérgicos gastrointestinales tempranos. En cambio, la mejoría del ánimo depende también de adaptaciones neurobiológicas que se desarrollan con el tiempo. Algunas personas empiezan a mejorar antes de que transcurran varias semanas.","tag":"SERT · respuesta clínica","whyOptions":["Es cierto que las náuseas pueden aparecer pronto, pero alcanzar el estado estable en plasma no explica por sí solo el inicio de la respuesta clínica.","Esta opción distingue el efecto inmediato sobre SERT de los cambios posteriores en autorreceptores, circuitos neuronales y plasticidad.","Los autorreceptores 5-HT₁A intervienen en la adaptación al tratamiento, pero no impiden que fluoxetina inhiba SERT desde el comienzo."]},{"id":"S2","pts":5,"type":"choice","prompt":"Tras aumentar la dosis de venlafaxina, un paciente presenta cifras de presión arterial más altas. No ha iniciado otros medicamentos. ¿Qué cambio farmacodinámico explica mejor este hallazgo?","opts":["El aumento de serotonina periférica modifica la regulación autonómica y contribuye a elevar progresivamente la presión arterial.","La desvenlafaxina estimula directamente los receptores β-adrenérgicos vasculares y aumenta la presión arterial al elevar la dosis.","La mayor inhibición de NET favorece la neurotransmisión noradrenérgica y puede contribuir al incremento de la presión arterial."],"ans":2,"why":"Al aumentar la exposición a venlafaxina puede adquirir mayor relevancia la inhibición de NET. El incremento de la neurotransmisión noradrenérgica se asocia con elevaciones de la presión arterial, por lo que conviene revisar las cifras y el tratamiento.","tag":"NET · presión arterial","whyOptions":["La serotonina también participa en la regulación autonómica, pero no es la explicación farmacológica más específica de este efecto dependiente de la dosis.","La desvenlafaxina es un metabolito activo que inhibe la recaptación de monoaminas; no actúa como agonista β-adrenérgico directo.","Esta explicación relaciona el aumento de dosis con la inhibición de NET y la respuesta cardiovascular que debe vigilarse."]},{"id":"S3","pts":5,"type":"choice","prompt":"Una paciente duerme mejor desde que toma mirtazapina, aunque sigue sintiéndose somnolienta al despertar. ¿Qué mecanismo explica principalmente este efecto adverso?","opts":["El antagonismo central de los receptores H₁ reduce la señal de vigilia y puede producir somnolencia durante la mañana.","El antagonismo de los receptores 5-HT₂ modifica la arquitectura del sueño y explica la mayor parte de la sedación residual.","El antagonismo de los receptores α₂ aumenta la liberación de monoaminas y genera principalmente el efecto sedante observado."],"ans":0,"why":"La somnolencia asociada a mirtazapina se debe principalmente al antagonismo de los receptores histaminérgicos H₁. El antagonismo 5-HT₂ también influye en el perfil del sueño, mientras que el bloqueo α₂ favorece la liberación de noradrenalina y serotonina.","tag":"H₁ · efecto adverso","whyOptions":["El antagonismo H₁ explica de forma predominante la sedación y puede contribuir a la somnolencia residual al día siguiente.","El bloqueo 5-HT₂ puede mejorar características del sueño, pero no explica por sí solo la intensa acción sedante de mirtazapina.","El bloqueo α₂ facilita la liberación de noradrenalina y serotonina; no es el principal mecanismo responsable de la somnolencia."]}]},{"id":"consultorio","tag":"02 / SELECCIÓN CLÍNICA","title":"Tres expedientes, tres decisiones","subtitle":"Abre cada expediente, identifica el dato decisivo y elige la conducta mejor sustentada. No existe un antidepresivo superior para todas las personas.","minutes":"4 min","max":30,"theme":"violet","glyph":"✚","refs":[["Goodman & Gilman, 14.ª ed., cap. 18, usos y perfiles comparativos (PDF, pp. 587–604)",""],["Katzung, 15.ª ed., cap. 30, selección terapéutica y caso clínico (PDF, pp. 1, 15–28)",""],["OpenEvidence, PDF adjunto, comparación fluoxetina/venlafaxina, pp. 24–28 (síntesis de evidencia)",""],["Medsafe (2019): interacción CYP2D6 de tamoxifeno con fluoxetina","https://www.medsafe.govt.nz/Profs/PUArticles/December2019/Reminder-avoid-using-CYP2D6-inhibitors-with-tamoxifen.htm"]],"qs":[{"id":"C1","pts":10,"type":"choice","person":"Lucía · 36 años","icon":"🌙","vitals":["Depresión mayor","Insomnio importante","Pérdida de apetito"],"prompt":"Lucía tiene depresión mayor, insomnio persistente, poco apetito y pérdida de peso. No presenta comorbilidades relevantes. ¿Qué antidepresivo podría beneficiar mejor su conjunto de síntomas?","opts":["Elegir venlafaxina por su eficacia antidepresiva, considerando que podría mejorar la fatiga, aunque será necesario vigilar el sueño.","Elegir fluoxetina por su eficacia antidepresiva, considerando que podría mejorar la ansiedad, aunque será necesario vigilar el apetito.","Elegir mirtazapina por su eficacia antidepresiva y porque puede favorecer el sueño y el apetito, vigilando la sedación y el peso."],"ans":2,"why":"Los tres medicamentos son eficaces para tratar la depresión mayor. En esta paciente, mirtazapina permite aprovechar su perfil sedante y su tendencia a aumentar el apetito. Esto no significa que sea globalmente más eficaz como antidepresivo.","tag":"Eficacia · seguridad","whyOptions":["Venlafaxina puede ser una opción válida para tratar la depresión, pero no aprovecha de la misma manera el insomnio y la pérdida de apetito predominantes.","Fluoxetina también puede tratar la depresión y la ansiedad, aunque al inicio puede asociarse con insomnio o reducción del apetito.","Mirtazapina trata la depresión y ofrece efectos adicionales que pueden ser útiles para los síntomas acompañantes de esta paciente."]},{"id":"C2","pts":10,"type":"choice","person":"Diego · 51 años","icon":"🩺","vitals":["Depresión mayor","HTA aún no controlada","Se valora venlafaxina"],"prompt":"Diego tiene depresión mayor y cifras de presión arterial persistentemente elevadas pese al tratamiento antihipertensivo. Se considera iniciar venlafaxina. ¿Cuál sería la decisión inicial más prudente?","opts":["Iniciar venlafaxina de liberación prolongada a dosis baja y comprobar la presión arterial durante la siguiente revisión mensual.","Controlar primero la presión arterial y comparar otras opciones antidepresivas antes de decidir si se utiliza venlafaxina.","Elegir venlafaxina por su potencial efecto activador y monitorizar la presión arterial únicamente después de aumentar la dosis."],"ans":1,"why":"Venlafaxina puede elevar la presión arterial, especialmente cuando aumenta su efecto noradrenérgico. Como Diego ya presenta hipertensión no controlada, conviene revisar primero el control tensional y considerar alternativas antes de iniciar el tratamiento.","tag":"Precauciones · eficacia","whyOptions":["Comenzar con dosis bajas y utilizar liberación prolongada puede mejorar la tolerancia, pero no sustituye la valoración de una hipertensión que sigue sin controlarse.","Esta decisión tiene en cuenta la comorbilidad y el posible efecto sobre NET antes de elegir un antidepresivo, sin cuestionar su eficacia para la depresión.","El posible efecto activador no justifica posponer las mediciones de presión arterial, puesto que el paciente ya tiene cifras elevadas antes de recibir venlafaxina."]},{"id":"C3","pts":10,"type":"choice","person":"Rosa · 48 años","icon":"🧬","vitals":["Depresión mayor","Tratamiento con tamoxifeno","Se comparan fluoxetina y venlafaxina"],"prompt":"Rosa recibe tamoxifeno y necesita tratamiento antidepresivo. Al comparar fluoxetina con venlafaxina, ¿qué diferencia farmacocinética es más importante para su elección?","opts":["Venlafaxina inhibe CYP2D6 con menor intensidad que fluoxetina y suele interferir menos con la formación de endoxifeno.","La norfluoxetina permanece activa durante más tiempo y, por ello, disminuye la interacción entre fluoxetina y tamoxifeno.","Venlafaxina también se metaboliza por CYP2D6, por lo que interfiere con tamoxifeno en una magnitud similar a fluoxetina."],"ans":0,"why":"CYP2D6 participa en la formación de endoxifeno, uno de los metabolitos activos de tamoxifeno. Fluoxetina inhibe de forma potente esta enzima, mientras que venlafaxina presenta una inhibición mucho menor. Ser sustrato de una enzima no equivale a bloquearla con la misma intensidad.","tag":"Interacciones · CYP","whyOptions":["La menor inhibición de CYP2D6 por venlafaxina puede resultar relevante al elegir un antidepresivo para una paciente que recibe tamoxifeno.","La persistencia de norfluoxetina no protege frente a la interacción; por el contrario, puede prolongar la inhibición de CYP2D6.","Aunque venlafaxina es metabolizada por CYP2D6, esto no significa que inhiba esa enzima con la misma potencia que fluoxetina."]}]},{"id":"tiempo","tag":"03 / FARMACOCINÉTICA","title":"El reloj de los medicamentos","subtitle":"Mueve el tiempo y observa cómo cambia una cantidad hipotética tras una única administración. Después aplica la farmacocinética a decisiones reales.","minutes":"3 min","max":20,"theme":"amber","glyph":"◷","refs":[["Goodman & Gilman, 14.ª ed., cap. 18, tabla 18-3 y apartado ADME (PDF, pp. 595–597)",""],["Katzung, 15.ª ed., cap. 30, perfiles farmacocinéticos (PDF, pp. 19–25)",""],["DailyMed, ficha de fluoxetina: intervalo con inhibidores de MAO","https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8b8fe00e-7a2f-486b-9b72-465a494d8939"]],"qs":[{"id":"K1","pts":10,"type":"choice","prompt":"Dos pacientes suspenden bruscamente sus antidepresivos: uno tomaba venlafaxina y otro fluoxetina. ¿En cuál esperarías síntomas de discontinuación más tempranos y por qué?","opts":["En quien tomaba fluoxetina, porque la presencia prolongada de norfluoxetina favorece una retirada más rápida del efecto clínico.","En quien tomaba venlafaxina, porque las concentraciones del fármaco y de su metabolito activo disminuyen más rápidamente.","En ninguno si venlafaxina era de liberación prolongada, porque esa formulación mantiene una exposición estable tras suspenderla."],"ans":1,"why":"Tras suspender venlafaxina, la exposición al fármaco y a desvenlafaxina disminuye relativamente rápido, lo que favorece síntomas de discontinuación más tempranos. Fluoxetina y norfluoxetina permanecen más tiempo en el organismo y suelen producir una caída más gradual.","tag":"Semivida · suspensión","whyOptions":["La vida media prolongada de fluoxetina y norfluoxetina suele retrasar la disminución de la exposición; esta opción invierte el mecanismo esperado.","La vida media relativamente corta de venlafaxina y su metabolito favorece una caída de concentraciones más rápida después de suspenderlos.","La formulación de liberación prolongada modifica la absorción mientras se administra, pero no evita el descenso de concentraciones después de suspenderla."]},{"id":"K2","pts":10,"type":"choice","prompt":"Una paciente suspendió fluoxetina hace siete días y se plantea iniciar fenelzina, un IMAO irreversible. ¿Cuánto tiempo mínimo debe transcurrir entre ambos tratamientos?","opts":["Esperar al menos dos semanas, como ocurre al cambiar desde diversos antidepresivos con vidas medias más cortas.","Esperar al menos cuatro semanas, dado que una parte importante de la fluoxetina ya se habrá eliminado.","Esperar al menos cinco semanas, debido a la eliminación lenta de fluoxetina y de su metabolito norfluoxetina."],"ans":2,"why":"Antes de iniciar un IMAO psiquiátrico después de suspender fluoxetina se requiere, en general, un intervalo de lavado de al menos cinco semanas. Su metabolito activo puede persistir durante un tiempo prolongado y aumentar el riesgo de toxicidad serotoninérgica si los tratamientos se superponen.","tag":"Interacción · eliminación","whyOptions":["Dos semanas pueden ser suficientes para determinadas transiciones entre otros antidepresivos, pero no para este cambio desde fluoxetina.","Cuatro semanas representan un intervalo considerable, pero todavía son menos de las cinco semanas recomendadas para este cambio.","El intervalo de cinco semanas tiene en cuenta tanto la vida media prolongada de fluoxetina como la persistencia de norfluoxetina."]}]},{"id":"vigilancia","tag":"04 / REACCIONES ADVERSAS","title":"Sala de farmacovigilancia","subtitle":"Identifica el mecanismo probable, compara hipótesis razonables y decide una conducta proporcionada. Toca la prioridad de manejo en cada tarjeta.","minutes":"3 min","max":15,"theme":"coral","glyph":"⚑","refs":[["Goodman & Gilman, 14.ª ed., cap. 18, efectos adversos e interacciones (PDF, pp. 597–603)",""],["Katzung, 15.ª ed., cap. 30, reacciones adversas de ISRS, IRSN y mirtazapina (PDF, pp. 22–33)",""],["DailyMed, fluoxetina: síndrome serotoninérgico y advertencias clínicas","https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8b8fe00e-7a2f-486b-9b72-465a494d8939"]],"qs":[{"id":"V1","pts":3,"type":"triage","person":"Fluoxetina: náusea leve","icon":"🤢","prompt":"Una paciente de 29 años presenta náuseas leves durante la primera semana de fluoxetina. Come y bebe con normalidad y no tiene síntomas neurológicos. ¿Qué conducta inicial sería más adecuada?","opts":["Vigilar la tolerancia y valorar ajustes del tratamiento si las náuseas persisten o comienzan a afectar su alimentación.","Solicitar de forma prioritaria una determinación de sodio para descartar hiponatremia relacionada con el antidepresivo.","Prescribir un antiemético desde esta consulta y continuar fluoxetina, sin modificar por ahora el seguimiento previsto."],"ans":0,"why":"Las náuseas leves al iniciar fluoxetina son compatibles con una reacción adversa tipo A. En este caso, la vigilancia de la intensidad, la hidratación y la evolución es una medida inicial proporcionada. Otras pruebas o medicamentos pueden ser útiles si aparecen factores de riesgo o los síntomas empeoran.","tag":"Tipo A","whyOptions":["Vigilar la tolerancia es razonable ante síntomas leves, siempre que se reevalúe la situación si las náuseas persisten o afectan la ingesta.","La hiponatremia es una posible complicación de los ISRS, pero los datos aportados no la convierten en la primera explicación del cuadro.","Un antiemético podría considerarse si los síntomas lo justifican, pero añadirlo de entrada puede exponer a interacciones innecesarias."]},{"id":"V2","pts":3,"type":"triage","person":"Mirtazapina: sueño matutino","icon":"💤","prompt":"Después de iniciar mirtazapina, una paciente presenta somnolencia por la mañana. No toma otros sedantes, pero trabaja como conductora. ¿Qué interpretación orienta mejor la conducta clínica?","opts":["Investigar primero otras causas de somnolencia, como hábitos de sueño o descanso insuficiente, antes de atribuirla al tratamiento.","Considerar que la depresión continúa alterando su sueño y esperar a evaluar la respuesta antes de modificar el seguimiento.","Interpretarla como una reacción tipo A por antagonismo H₁ y valorar su intensidad y el riesgo de conducir somnolienta."],"ans":2,"why":"El antagonismo H₁ de mirtazapina puede causar somnolencia, incluso al día siguiente. La relación temporal con el inicio del tratamiento y la ausencia de otros sedantes apoyan una reacción tipo A. Como la paciente conduce por trabajo, debe valorarse especialmente el riesgo funcional.","tag":"Tipo A","whyOptions":["Los hábitos de sueño siempre pueden influir, pero la aparición del síntoma tras iniciar mirtazapina hace prioritario valorar su acción sedante.","La depresión puede afectar el descanso, pero no conviene atribuir automáticamente a la enfermedad un síntoma que aparece al iniciar el fármaco.","Esta opción reconoce una reacción previsible por bloqueo H₁ y considera cómo puede comprometer la seguridad de una actividad cotidiana."]},{"id":"V3","pts":3,"type":"triage","person":"Venlafaxina: presión más alta","icon":"📈","prompt":"Tras aumentar la dosis de venlafaxina, la presión arterial pasa de 122/76 a 137/86 mmHg en mediciones repetidas. No hay síntomas ni signos de daño agudo. ¿Cuál sería el siguiente paso más razonable?","opts":["Mantener la dosis actual y repetir las mediciones, porque la elevación podría desaparecer conforme avance el tratamiento.","Considerar una reacción tipo A, confirmar las cifras y reevaluar la dosis de venlafaxina y su beneficio clínico.","Ajustar el tratamiento antihipertensivo y mantener venlafaxina, ya que la presión puede controlarse por separado."],"ans":1,"why":"Una elevación leve de la presión arterial después de aumentar venlafaxina puede ser una reacción tipo A relacionada con su acción noradrenérgica. Sin datos de urgencia, conviene confirmar las cifras, continuar el seguimiento y reevaluar la dosis y el balance entre beneficios y riesgos.","tag":"Tipo A","whyOptions":["Repetir las mediciones es útil, pero también es importante considerar la relación temporal con el cambio de dosis y reevaluar el tratamiento.","Esta decisión reconoce un efecto farmacológico previsible y propone una respuesta proporcionada a la magnitud del cambio tensional.","Modificar un antihipertensivo puede ser necesario en determinadas circunstancias, pero antes debe revisarse el fármaco cuyo ajuste precedió al cambio."]},{"id":"V4","pts":3,"type":"triage","person":"Fiebre y clonus tras combinación","icon":"🚨","prompt":"Horas después de combinar fluoxetina con un IMAO, una paciente presenta agitación, hipertermia, clonus e hiperreflexia. ¿Cuál es la prioridad clínica?","opts":["Suspender los medicamentos implicados y solicitar valoración médica inmediata ante la sospecha de síndrome serotoninérgico.","Suspender primero el IMAO y mantener observación estrecha durante unas horas para comprobar si cede la hipertermia.","Controlar inicialmente la agitación y estudiar otras causas antes de decidir si es necesario suspender ambos medicamentos."],"ans":0,"why":"La asociación de hipertermia, clonus e hiperreflexia después de una combinación serotoninérgica obliga a sospechar síndrome serotoninérgico. Es una situación potencialmente grave que requiere atención inmediata y suspensión de los agentes responsables bajo atención médica.","tag":"Urgencia","whyOptions":["Esta conducta atiende una posible toxicidad serotoninérgica grave sin retrasar la evaluación ni el tratamiento necesarios.","Suspender uno de los medicamentos no basta como única medida cuando ya existen manifestaciones neuromusculares y sistémicas importantes.","La agitación puede tener otras causas, pero la hipertermia y el clonus hacen prioritario descartar y atender el síndrome serotoninérgico."]},{"id":"V5","pts":3,"type":"triage","person":"Ideas suicidas nuevas","icon":"⚠️","prompt":"Un adulto joven presenta ideas de autolesión nuevas y un rápido empeoramiento después de iniciar un antidepresivo. No cuenta con un plan de seguridad. ¿Qué medida debe priorizarse?","opts":["Revisar la dosis del antidepresivo y citarlo en 48 horas para valorar si el tratamiento está comenzando a funcionar.","Contactarlo para comprobar adherencia y tolerancia antes de decidir si requiere una valoración presencial.","Evaluar de inmediato el riesgo de autolesión y organizar las medidas de protección y atención que necesite."],"ans":2,"why":"La aparición de ideas de autolesión o el empeoramiento importante exige una valoración inmediata de seguridad. El ajuste del antidepresivo y la revisión de la adherencia son relevantes, pero no deben retrasar la evaluación del riesgo.","tag":"Urgencia","whyOptions":["La eficacia y la dosis deben revisarse, pero eso no sustituye la evaluación inmediata de un posible riesgo de autolesión.","La adherencia es importante para el tratamiento, pero primero debe determinarse si la persona necesita protección y atención urgente.","Esta opción prioriza la seguridad y permite decidir el nivel de atención y las medidas de apoyo según la gravedad."]}]},{"id":"interacciones","tag":"05 / INTERACCIONES","title":"Cruces farmacológicos","subtitle":"Abre las tarjetas de interacción, compara los mecanismos y decide qué precaución tiene mayor peso clínico.","minutes":"3 min","max":10,"theme":"blue","glyph":"⇄","refs":[["Goodman & Gilman, 14.ª ed., cap. 18, inhibición de CYP2D6 y toxicidad serotoninérgica (PDF, pp. 595–604)",""],["Katzung, 15.ª ed., cap. 30, interacciones y síndrome serotoninérgico (PDF, pp. 24–35)",""],["DailyMed, fluoxetina: interacciones y periodo con IMAO","https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=8b8fe00e-7a2f-486b-9b72-465a494d8939"],["Medsafe (2019), inhibición de CYP2D6 y tamoxifeno","https://www.medsafe.govt.nz/Profs/PUArticles/December2019/Reminder-avoid-using-CYP2D6-inhibitors-with-tamoxifen.htm"]],"qs":[{"id":"I1","pts":5,"type":"choice","prompt":"Una persona utiliza tramadol para tratar dolor crónico y se considera añadir venlafaxina por depresión. ¿Qué interacción debe revisarse con mayor atención antes de prescribir?","opts":["El metabolismo de tramadol mediante CYP2D6, porque cualquier cambio en esta vía podría modificar su efecto analgésico.","La suma de efectos serotoninérgicos, porque puede aumentar el riesgo de síndrome serotoninérgico y convulsiones.","La posibilidad de náuseas, sudoración e insomnio, porque ambos tratamientos pueden afectar la tolerancia cotidiana."],"ans":1,"why":"Tramadol y venlafaxina tienen actividad monoaminérgica. Su combinación puede incrementar el riesgo de toxicidad serotoninérgica y convulsiones, una interacción farmacodinámica que debe valorarse antes de iniciar el tratamiento conjunto.","tag":"Interacción farmacodinámica","whyOptions":["El metabolismo por CYP2D6 puede modificar la respuesta a tramadol, pero aquí la suma de efectos serotoninérgicos representa una alerta clínica más importante.","Esta alternativa reconoce un riesgo potencialmente grave que deriva de los mecanismos farmacológicos de ambos medicamentos.","Las molestias de tolerancia son relevantes, pero no deben hacer pasar inadvertidos los riesgos de mayor gravedad de esta combinación."]},{"id":"I2","pts":5,"type":"choice","prompt":"Una paciente que toma mirtazapina comienza a utilizar lorazepam para dormir y al día siguiente nota somnolencia intensa. ¿Qué explicación es la más probable?","opts":["Los efectos sedantes pueden sumarse porque mirtazapina antagoniza H₁ y lorazepam potencia la transmisión mediada por GABA-A.","Lorazepam puede elevar de forma importante las concentraciones de mirtazapina al reducir su metabolismo hepático por CYP3A4.","El aumento de noradrenalina por mirtazapina compensa parcialmente la sedación del lorazepam, por lo que debe priorizarse otro mecanismo."],"ans":0,"why":"Aunque actúan sobre dianas distintas, mirtazapina y lorazepam pueden producir sedación aditiva. Mirtazapina antagoniza receptores H₁ y lorazepam potencia la acción de GABA sobre GABA-A. La interacción es principalmente farmacodinámica y aumenta el riesgo de somnolencia, caídas y problemas para conducir.","tag":"Interacción farmacodinámica","whyOptions":["Los mecanismos son diferentes, pero ambos reducen el estado de alerta. La suma de efectos explica la somnolencia intensa.","Lorazepam se metaboliza principalmente por glucuronidación y no suele causar esta interacción mediante una inhibición importante de CYP3A4.","La liberación de noradrenalina no anula la sedación que puede producir el antagonismo H₁ de mirtazapina combinado con lorazepam."]}]},{"id":"perinatal","tag":"06 / EMBARAZO Y LACTANCIA","title":"Dos vidas, una decisión compartida","subtitle":"La gestación y la lactancia no convierten automáticamente a un medicamento en seguro ni prohibido. Contrasta exposición, evidencia y recaída.","minutes":"3 min","max":10,"theme":"rose","glyph":"♡","refs":[["ACOG, Clinical Practice Guideline No. 5 (2023): tratamiento perinatal","https://www.acog.org/clinical/clinical-guidance/clinical-practice-guideline/articles/2023/06/treatment-and-management-of-mental-health-conditions-during-pregnancy-and-postpartum"],["MotherToBaby: fluoxetina (2026), venlafaxina (2026), mirtazapina (2025)","https://mothertobaby.org/fact-sheets/fluoxetine-prozac-pregnancy/"],["LactMed (2026), Venlafaxine: exposición en leche y vigilancia en prematuros","https://www.ncbi.nlm.nih.gov/books/NBK501192/"]],"qs":[{"id":"P1","pts":5,"type":"choice","prompt":"Una paciente con depresión recurrente está embarazada de 10 semanas y lleva un año estable con fluoxetina. Antes sufrió una recaída al suspenderla. ¿Qué plan inicial ofrece el mejor balance de riesgos?","opts":["Proponer un cambio gradual a sertralina por la experiencia de uso durante el embarazo, con seguimiento de los síntomas depresivos.","Plantear una reducción progresiva de fluoxetina durante el primer trimestre y programar controles del estado de ánimo.","Valorar la respuesta previa, el riesgo de recaída y la exposición fetal junto con obstetricia antes de decidir si continúa fluoxetina."],"ans":2,"why":"La decisión debe considerar tanto la exposición fetal como la estabilidad materna y los antecedentes de recaída. Cambiar o reducir un antidepresivo eficaz sin una evaluación individual puede aumentar el riesgo de descompensación. La elección requiere una conversación compartida con la paciente y el equipo tratante.","tag":"Gestación · decisiones compartidas","whyOptions":["Sertralina cuenta con experiencia de uso perinatal, pero cambiar un tratamiento que ha sido eficaz también implica riesgos y no siempre es preferible.","Reducir la exposición es una consideración legítima, pero disminuir el tratamiento de forma rutinaria puede favorecer una recaída.","Esta alternativa integra la respuesta al tratamiento, el antecedente de recaída y los posibles riesgos maternos y fetales antes de decidir."]},{"id":"P2","pts":5,"type":"choice","prompt":"Una madre que continúa estable con venlafaxina desea amamantar a su bebé prematuro de 35 semanas. En el pasado recayó al cambiar de antidepresivo. ¿Qué plan inicial ofrece el balance más razonable?","opts":["Considerar un cambio gradual a sertralina por su menor transferencia a la leche, con vigilancia del estado de ánimo materno.","Valorar continuar venlafaxina y vigilar de cerca somnolencia, alimentación y ganancia de peso del bebé prematuro.","Continuar venlafaxina y organizar las tomas según el horario de la dosis para reducir la exposición del lactante."],"ans":1,"why":"Venlafaxina y su metabolito activo pueden pasar a la leche materna. La prematuridad exige especial atención a la somnolencia, la alimentación y la ganancia de peso del lactante. Cambiar un tratamiento que mantiene estable a la madre también tiene riesgos; por ello, conviene individualizar la decisión y planificar la vigilancia.","tag":"Lactancia · vigilancia","whyOptions":["Sertralina presenta una exposición láctea generalmente menor, pero cambiar de fármaco en una madre estable y con antecedentes de recaída no es siempre la opción más adecuada.","Esta alternativa tiene en cuenta el beneficio materno y la mayor vulnerabilidad del prematuro, e incorpora vigilancia específica.","Ajustar el horario de las tomas no garantiza una exposición mínima, porque también debe considerarse la presencia del metabolito activo de venlafaxina."]}]}],"sourceCards":[{"title":"Goodman & Gilman, 14.ª edición","note":"Capítulo 18, Drug Therapy of Depression and Anxiety Disorders; capítulo 15, 5-HT; edición compartida por ti."},{"title":"Katzung, 15.ª edición","note":"Capítulo 30, Fármacos antidepresivos; capítulos 16 y 21 para fisiología y receptores."},{"title":"OpenEvidence, PDF proporcionado","note":"Síntesis de neurotransmisión e investigaciones citadas. Se contrastó con textos y fuentes clínicas."},{"title":"ACOG · LactMed · MotherToBaby","note":"Guías y resúmenes clínicos para embarazo y lactancia; fichas regulatorias para contraindicaciones."}]};

const KINETICS={fluox:['Fluoxetina',53],nor:['Norfluoxetina',240],ven:['Venlafaxina',5],des:['Desvenlafaxina',11],mir:['Mirtazapina',25]};
function fraction(t,half){return Math.max(0,Math.round(100*Math.pow(.5,t/half)))}
function kineticPanel(){return `<div class="panel timeViz"><div class="eyebrow" style="color:#8cf3db">SIMULADOR · ELIMINACIÓN HIPOTÉTICA</div><h3 style="font-size:24px;margin:8px 0 8px">${hours} horas después</h3><p style="font-size:12px;color:#d7e6f6">Desliza el tiempo tras una dosis hipotética para comparar semividas, sin asumir concentraciones reales en un paciente.</p><input aria-label="Horas transcurridas" type="range" id="hours" min="0" max="240" step="1" value="${hours}"/><div class="tbuttons">${[6,24,72,120,168,240].map(h=>`<button data-hour="${h}" class="${hours===h?'on':''}">${h<24?h+' h':h/24+' días'}</button>`).join('')}</div><div class="meterRows">${Object.entries(KINETICS).map(([k,v])=>`<div class="meterRow"><span>${v[0]}</span><div class="meter"><i style="width:${fraction(hours,v[1])}%"></i></div><b>${fraction(hours,v[1])}%</b></div>`).join('')}</div><div class="legend">Valores aproximados: fluoxetina 53 h; norfluoxetina 240 h; venlafaxina 5 h; desvenlafaxina 11 h; mirtazapina ~25 h (rango clínico 16–30 h). Las curvas parten artificialmente de 100% por separado: no simulan formación metabólica, acumulación, dosificación repetida ni dosis clínicas.</div></div>`}
function sceneTime(s){return `${header(s)}<div class="grid2">${kineticPanel()}<div class="panel"><div class="eyebrow">ADME · INFORMACIÓN CLAVE</div><h3>¿Por qué importa la semivida?</h3><div class="statbox" style="margin-top:13px"><b>Fluoxetina</b><p style="margin:6px 0 0">Se transforma en norfluoxetina activa; ambas persisten durante días a semanas. Es inhibidora importante de CYP2D6.</p></div><div class="statbox" style="margin-top:11px"><b>Venlafaxina</b><p style="margin:6px 0 0">CYP2D6 forma desvenlafaxina activa. La eliminación es más rápida y deben considerarse función renal y hepática.</p></div><div class="statbox" style="margin-top:11px"><b>Mirtazapina</b><p style="margin:6px 0 0">Metabolismo hepático; semivida de 16–30 h. El aclaramiento puede disminuir en edad avanzada y disfunción orgánica.</p></div></div></div><div class="tasklist" style="margin-top:13px">${s.qs.map(question).join('')}</div>${sourceFoot(s)}${bottom()}`}
function sceneSafety(s){return `${header(s)}<div class="grid2"><div class="panel"><div class="eyebrow">CLASIFICACIÓN CLÍNICA</div><h3>De la farmacodinamia a la conducta</h3><p>Distingue <b>qué provoca el problema</b> (efecto farmacológico o interacción) de <b>qué necesita el paciente</b> (vigilancia o atención urgente). Las reacciones tipo A son previsibles por la farmacología, pero algunas reacciones previsibles también pueden ser graves. <b>Selecciona la conducta más apropiada según la gravedad descrita.</b></p><div class="note" style="margin-bottom:13px"><b>Pista de razonamiento:</b> una reacción puede ser de tipo A y aun así requerir más vigilancia. Valora gravedad, temporalidad, comorbilidades y medicamentos concomitantes antes de decidir.</div><div class="riskGrid"><div class="riskCard"><b>01 · Efecto esperado</b><p>Monitorizar y valorar tolerancia, intensidad y ajustes.</p></div><div class="riskCard"><b>02 · Señal de alarma</b><p>Reconocer síntomas que requieren atención inmediata.</p></div><div class="riskCard"><b>03 · Interacción</b><p>Identificar la combinación causal; si hay signos graves, actuar con urgencia.</p></div></div></div><div class="viz" style="min-height:205px;background:linear-gradient(135deg,#462a55,#152944)"><div class="vt">RADAR DE FARMACOVIGILANCIA</div><svg viewBox="0 0 400 180" aria-hidden="true"><g fill="none" stroke="#acb1ff55" stroke-width="2"><circle cx="200" cy="91" r="75"/><circle cx="200" cy="91" r="49"/><circle cx="200" cy="91" r="22"/><path d="M70 91H330M200 13V169"/></g><path d="M200 91 L275 37" stroke="#7cfae0" stroke-width="4"/><circle cx="275" cy="37" r="10" fill="#7cfae0"/><circle cx="158" cy="119" r="9" fill="#fbb67d"/><circle cx="228" cy="64" r="8" fill="#c4a3ff"/><circle cx="242" cy="136" r="11" fill="#fc849b"/><text fill="#d7e3ff" x="17" y="27" font-size="11">RAM</text><text fill="#d7e3ff" x="305" y="160" font-size="11">SEGURIDAD</text></svg><div class="describ">Identifica primero el <b>mecanismo</b> y decide después la <b>conducta</b>. La prioridad asistencial define la mejor opción.</div></div></div><div class="vigilance" style="margin-top:14px">${s.qs.map(q=>`<article class="vCard"><span class="signal">${q.icon}</span><div class="promptline"><span class="idlabel">${q.id} · ${q.person}</span><span class="points">${q.pts} pts</span></div><h4>${q.prompt}</h4><div class="vChoices">${q.opts.map((o,i)=>{const d=done[q.id];return `<button data-answer="${q.id}|${i}" ${d?'disabled':''} class="${d?(i===q.ans?'ok':i===d.answer?'bad':''):''}">${esc(o)}</button>`}).join('')}</div>${done[q.id]?`<div class="vfeed"><b>${done[q.id].correct?'✓ Decisión mejor sustentada':'↺ Revisa el matiz'} · +${done[q.id].pts}/${q.pts}</b><p>${esc(q.why)}</p><div class="chosenWhy"><b>Tu elección ${String.fromCharCode(65+done[q.id].answer)}:</b> ${esc(q.whyOptions[done[q.id].answer])}</div><details class="comparar"><summary>Analizar las alternativas</summary><div class="alternatives">${q.whyOptions.map((x,i)=>`<p><b>${String.fromCharCode(65+i)} ${i===q.ans?'· Opción mejor fundamentada':'· Por qué no es la mejor'}:</b> ${esc(x)}</p>`).join('')}</div></details></div>`:''}</article>`).join('')}</div>${sourceFoot(s)}${bottom()}`}
function sceneInteraction(s){return `${header(s)}<div class="grid2"><section class="panel"><h3>Conecta la molécula con el riesgo</h3><p>Selecciona una combinación para abrir su efecto. Algunas interacciones son farmacocinéticas y otras farmacodinámicas.</p><div class="chiprow">${[['fx','Fluoxetina + tamoxifeno'],['vt','Venlafaxina + tramadol'],['mz','Mirtazapina + sedantes']].map(([id,n])=>`<button data-pair="${id}" class="chip ${opened.pair===id?'on':''}">${n}</button>`).join('')}</div><div class="interPair" style="margin-top:13px">${opened.pair==='vt'?'<div class="medPill">Venlafaxina<b>IRSN</b></div><span class="pairX">×</span><div class="medPill">Tramadol<b>μ + SERT/NET</b></div>':opened.pair==='mz'?'<div class="medPill">Mirtazapina<b>H₁</b></div><span class="pairX">×</span><div class="medPill">Sedantes<b>SNC</b></div>':'<div class="medPill">Fluoxetina<b>CYP2D6 ↓</b></div><span class="pairX">×</span><div class="medPill">Tamoxifeno<b>Endoxifeno ↓</b></div>'}</div><div class="statbox" style="margin-top:12px"><b>Consecuencia esperada</b><p style="margin:7px 0 0">${opened.pair==='vt'?'Mayor riesgo de toxicidad serotoninérgica y convulsiones; requiere revisar la combinación.':opened.pair==='mz'?'La sedación puede sumarse a la de otros depresores del SNC; revisar riesgo de caídas y accidentes.':'La inhibición importante de CYP2D6 por fluoxetina puede reducir la formación de endoxifeno activo.'}</p></div></section><section class="panel"><div class="eyebrow">ACTIVIDAD CLÍNICA</div><h3>El dato que cambia todo</h3><div class="mat" style="min-height:205px"><strong>Interacción ≠<br>contraindicación universal</strong><p>Reconoce el mecanismo, la magnitud del riesgo y la situación del paciente.</p><div class="blob">🔬</div></div><div class="note" style="margin-top:13px"><b>Precaución adicional:</b> no combinar fármacos serotoninérgicos con IMAO sin respetar periodos de lavado. Vigilar también otros medicamentos, hiponatremia, sangrado y activación clínica.</div></section></div><div class="tasklist" style="margin-top:12px">${s.qs.map(question).join('')}</div>${sourceFoot(s)}${bottom()}`}
function scenePeri(s){return `${header(s)}<div class="panel"><div class="riskTabs"><button class="${risktab==='embarazo'?'on':''}" data-risktab="embarazo">🤰 Durante el embarazo</button><button class="${risktab==='lactancia'?'on':''}" data-risktab="lactancia">🍼 Durante la lactancia</button></div><div class="riskGrid">${Object.entries(PREGTAB[risktab]).map(([id,v])=>`<div class="riskCard"><b>${DRUGS[id].name}</b><p>${v}</p></div>`).join('')}</div><div class="note" style="margin-top:13px">Información clínica resumida, no una clasificación absoluta. La enfermedad materna no tratada también puede ocasionar daño. Considerar trimestre, recién nacido o prematuridad, respuesta previa y decisión compartida.</div></div><div class="grid2" style="margin-top:14px"><div class="viz" style="min-height:210px;background:linear-gradient(135deg,#643a68,#253452)"><div class="vt">DECISIÓN MATERNOINFANTIL</div><svg viewBox="0 0 440 215" aria-hidden="true"><g fill="none" stroke="#8eeadc" stroke-width="3"><path d="M219 35 C137-15 111 70 174 119 L219 158 L264 119 C329 68 298-15 219 35Z"/></g><g fill="#c89ffc" opacity=".8"><circle cx="153" cy="75" r="15"/><circle cx="287" cy="75" r="15"/></g><g stroke="#7a9ce0" stroke-width="3" fill="none"><path d="M219 160 V190 M173 111 L95 164 M265 111 L344 164"/></g><g fill="#e6f7ff" font-size="13" font-weight="800"><text x="205" y="90">RIESGO</text><text x="39" y="183">MATERNO</text><text x="328" y="183">INFANTIL</text></g></svg><div class="describ">No hay riesgo cero: hay decisiones clínicas basadas en evidencia.</div></div><div class="panel"><h3>¿Qué comparas?</h3><div class="statbox"><b>Necesidad del tratamiento</b><p style="margin:6px 0 0">Gravedad, recurrencia de depresión, respuesta previa y riesgo de recaída.</p></div><div class="statbox" style="margin-top:9px"><b>Exposición y vigilancia</b><p style="margin:6px 0 0">Momento gestacional, posible adaptación neonatal, transferencia a leche y estado del lactante.</p></div><div class="statbox" style="margin-top:9px"><b>Opciones reales</b><p style="margin:6px 0 0">Continuar, adaptar o cambiar cuando esté clínicamente indicado; no suspender de forma automática.</p></div></div></div><div class="tasklist" style="margin-top:13px">${s.qs.map(question).join('')}</div>${sourceFoot(s)}${bottom()}`}
function result(){const s=score(),title=s>=85?'Dominio farmacológico sólido':s>=65?'Razonamiento clínico en desarrollo':'Identifica tus áreas para reforzar';return `<div class="slide"><div class="head"><div><div class="eyebrow">INFORME FINAL / MISIÓN COMPLETADA</div><h2>${title}</h2><p>Tu puntaje suma únicamente las primeras respuestas. Puedes revisar las explicaciones volviendo a cualquier estación.</p></div></div><div class="grid2"><div class="doneCard"><div class="eyebrow" style="color:#a1f4e7">PUNTUACIÓN GLOBAL</div><div class="tally">${s}<small>/100</small></div><p style="color:#e6f6ff;max-width:390px;font-size:14px;line-height:1.6">${s>=85?'Buen trabajo integrando eficacia, seguridad y farmacocinética.':s>=65?'Ya se conectan varios mecanismos; revisa los casos donde cambió la decisión.':'Este resultado te indica dónde reforzar el razonamiento antes de la exposición.'}</p><button data-act="restart" class="cta" style="margin-top:12px">↺ Intentar otra vez desde cero</button></div><div class="panel"><h3>Desglose por diapositiva</h3><div class="scorebars">${SLIDES.map(sl=>{const p=sl.qs.reduce((a,q)=>a+(done[q.id]?.pts||0),0);return `<div class="scorebar"><span>${sl.title}</span><div class="bar"><i style="width:${100*p/sl.max}%"></i></div><b>${p}/${sl.max}</b></div>`}).join('')}</div><p class="footnote" style="margin-top:15px">El resultado no se guarda en servidores ni se compara con otras personas.</p></div></div><section class="panel" style="margin-top:14px"><h3>En tres frases: lo que debe quedar claro</h3><div class="comparison"><div class="comp"><div class="drugname">Fluoxetina</div><p>Inhibe SERT; larga persistencia de norfluoxetina; vigilar CYP2D6, sangrado y síndrome serotoninérgico.</p></div><div class="comp"><div class="drugname">Venlafaxina</div><p>Inhibe SERT y NET; controlar presión arterial; importante síndrome de discontinuación.</p></div><div class="comp"><div class="drugname">Mirtazapina</div><p>Antagoniza α₂, 5-HT₂/5-HT₃ y H₁; sedación y aumento del apetito son efectos clave.</p></div></div></section><section class="refs" style="margin-top:15px"><strong>Fuentes principales de las seis diapositivas</strong><ul>${DATA.sourceCards.map(v=>`<li><b>${v.title}.</b> ${v.note}</li>`).join('')}</ul></section><div class="slideFooter"><span class="footSource">SINAPSIS / LAB V5.1 · Evaluación de razonamiento farmacológico</span><div class="fLink"><button class="footerBtn" data-act="home">Inicio</button><button class="footerBtn primary" data-act="restart">Repetir evaluación</button></div></div></div>`}
function render(){nav();stat();if(current<0){$('app').innerHTML=intro();return}if(current>=SLIDES.length){$('nav').classList.add('hidden');$('app').innerHTML=result();return}const s=SLIDES[current];const body=[sceneSynapse,sceneConsult,sceneTime,sceneSafety,sceneInteraction,scenePeri][current](s);$('app').innerHTML=`<div class="slide">${body}</div>`}
function transition(n){current=Math.max(-1,Math.min(SLIDES.length,n));render();window.scrollTo({top:0,behavior:'smooth'})}
function answer(qid,choice){if(done[qid])return;const q=SLIDES.flatMap(s=>s.qs).find(q=>q.id===qid);if(!q)return;const correct=choice===q.ans;done[qid]={answer:choice,correct,pts:correct?q.pts:0};render()}
function restart(){if(ticker){clearInterval(ticker);ticker=null}current=-1;timeLeft=1200;done={};drug='fluox';target='SERT';hours=24;risktab='embarazo';opened={};render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const node=e.target.closest('[data-target]');if(node){target=node.getAttribute('data-target');render();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.act==='start'){startClock();transition(0);return}if(b.dataset.act==='restart'){restart();return}if(b.dataset.act==='prev'){transition(current-1);return}if(b.dataset.act==='next'){transition(current+1);return}if(b.dataset.act==='home'){transition(-1);return}if(b.dataset.stage!==undefined){transition(Number(b.dataset.stage));return}if(b.dataset.drug){drug=b.dataset.drug;render();return}if(b.dataset.answer){const [id,i]=b.dataset.answer.split('|');answer(id,Number(i));return}if(b.dataset.hour!==undefined){hours=Number(b.dataset.hour);render();return}if(b.dataset.reveal){opened[b.dataset.reveal]=!opened[b.dataset.reveal];render();return}if(b.dataset.pair){opened.pair=b.dataset.pair;render();return}if(b.dataset.risktab){risktab=b.dataset.risktab;render();return}});
document.addEventListener('keydown',e=>{const node=e.target.closest('[data-target]');if(node&&(e.key==='Enter'||e.key===' ')){e.preventDefault();target=node.getAttribute('data-target');render()}});
document.addEventListener('input',e=>{if(e.target.id==='hours'){hours=Number(e.target.value);render()}});
render();
</script>
</body></html>
